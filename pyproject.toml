[project]
name = "praxis-helper"
version = "0.2.1"
description = "Praxis Helper – Server-Flask-App mit SQLite: Springerliste und Warteliste"
requires-python = ">=3.14"
dependencies = [
    "flask",
    "waitress",
    "werkzeug",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

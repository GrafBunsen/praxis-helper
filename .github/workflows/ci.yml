name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras
      - run: uv run pytest tests/ -v

  build-image:
    # Nur bei Versions-Tags ein Image bauen und als tar ablegen.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen und als tar speichern
        run: |
          TAG="${GITHUB_REF_NAME}"
          docker build -t praxis-helper:"${TAG}" .
          docker save praxis-helper:"${TAG}" -o "praxis-helper-${TAG}.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: praxis-helper-image
          path: praxis-helper-*.tar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-image
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: praxis-helper-image
      - uses: softprops/action-gh-release@v2
        with:
          files: praxis-helper-*.tar
